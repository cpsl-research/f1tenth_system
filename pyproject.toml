[project]
name = "f1tenth-system"
version = "0.0.1"
description = "Development of the F1Tenth autonomous driving system"
authors = [{ name = "Spencer Hallyburton", email = "spencer.hallyburton@duke.edu" }]
requires-python = ">=3.10,<3.11"
readme = "README.md"
license = "MIT"
keywords = [
    "autonomy",
    "f1tenth",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "setuptools<71",
    "avstack-core[percep]",
    "scikit-learn>1.0",
    "ros2_numpy",
]

[project.urls]
Repository = "https://github.com/cpsl-research/f1tenth_system"

[dependency-groups]
test = [
    "snakeviz>=2.1.1,<3",
    "pytest>=7,<8",
    "pytest-cov>=4,<5",
    "bandit~=1.7",
    "black[jupyter]~=22.12.0",
    "mypy>=0,<1",
    "isort~=5.11",
    "flake8~=5.0",
    "autoflake>=1,<2",
]

[tool.uv]
default-groups = ["test"]
package = false

[tool.uv.sources]
avstack-core = { path = "f1tenth_algorithms/submodules/avstack-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -s"
testpaths = [
    "tests",
    "integration",
]
